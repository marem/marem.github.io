name: Publish Quarto Site

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages   # <-- REQUIRED

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Render standalone courses
        run: |
          quarto render dla-course
          quarto render dla-course-2
          cp -R dla-course/_site/. docs/dla-course/
          cp -R dla-course-2/_site/. docs/dla-course-2/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs   # <-- adjust if your Quarto output folder is different

      - uses: actions/deploy-pages@v4
